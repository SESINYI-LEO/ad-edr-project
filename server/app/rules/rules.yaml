# Behaviour-based detection rules mapped to MITRE ATT&CK.
# Each rule is a list of AND-ed conditions; "threshold" rules fire when N matching events are seen
# for the same group_by key inside a sliding window.
# ops: eq, ne, in, not_in, regex, contains_any, gte, lte, is_public_ip   (string compares are case-insensitive)
- id: R001
  name: Encoded PowerShell command
  description: PowerShell launched with an encoded command, commonly used to hide payloads.
  severity: high
  technique: T1059.001
  tactic: Execution
  confidence: 70
  conditions:
    - {field: event_type, op: eq, value: process_create}
    - {field: process_name, op: in, value: [powershell.exe, pwsh.exe]}
    - {field: command_line, op: regex, value: '\s-(e|ec|en|enc|enco|encod|encode|encoded|encodedcommand)\s+[A-Za-z0-9+/=]{16,}'}
- id: R002
  name: Office application spawned a command interpreter
  description: Word, Excel, PowerPoint or Outlook launched PowerShell, cmd, wscript or mshta (macro / phishing payload).
  severity: critical
  technique: T1204.002
  tactic: Execution
  confidence: 80
  conditions:
    - {field: event_type, op: eq, value: process_create}
    - {field: parent_process, op: in, value: [winword.exe, excel.exe, powerpnt.exe, outlook.exe]}
    - {field: process_name, op: in, value: [powershell.exe, pwsh.exe, cmd.exe, wscript.exe, cscript.exe, mshta.exe]}
- id: R003
  name: LSASS memory access (credential dumping)
  description: A process opened lsass.exe with memory-read access rights.
  severity: critical
  technique: T1003.001
  tactic: Credential Access
  confidence: 85
  conditions:
    - {field: event_type, op: eq, value: process_access}
    - {field: target_process, op: eq, value: lsass.exe}
    - {field: granted_access, op: in, value: ['0x1010', '0x1410', '0x1438', '0x143a', '0x1fffff']}
    - {field: process_name, op: not_in, value: [msmpeng.exe, csrss.exe, wininit.exe, svchost.exe, taskmgr.exe]}
- id: R004
  name: Registry Run key persistence
  description: A value was written to a CurrentVersion\Run key so a program starts at logon.
  severity: medium
  technique: T1547.001
  tactic: Persistence
  confidence: 60
  conditions:
    - {field: event_type, op: eq, value: registry_set}
    - {field: registry_key, op: regex, value: '\\CurrentVersion\\Run(Once)?\\'}
    - {field: process_name, op: not_in, value: [msiexec.exe, setup.exe, onedrivesetup.exe]}
- id: R005
  name: Scheduled task created via schtasks
  description: schtasks.exe was used to create a scheduled task (persistence / execution).
  severity: medium
  technique: T1053.005
  tactic: Persistence
  confidence: 55
  conditions:
    - {field: event_type, op: eq, value: process_create}
    - {field: process_name, op: eq, value: schtasks.exe}
    - {field: command_line, op: regex, value: '/create\b'}
- id: R006
  name: Shadow copy deletion (ransomware precursor)
  description: Volume shadow copies or recovery settings were deleted, preventing recovery.
  severity: critical
  technique: T1490
  tactic: Impact
  confidence: 90
  conditions:
    - {field: event_type, op: eq, value: process_create}
    - {field: command_line, op: regex, value: '(vssadmin(\.exe)?\s+delete\s+shadows|wmic\s+shadowcopy\s+delete|bcdedit.*recoveryenabled\s+no|wbadmin\s+delete\s+catalog)'}
- id: R007
  name: Tool download via certutil/bitsadmin
  description: A living-off-the-land binary was used to download a file from a URL.
  severity: high
  technique: T1105
  tactic: Command and Control
  confidence: 70
  conditions:
    - {field: event_type, op: eq, value: process_create}
    - {field: process_name, op: in, value: [certutil.exe, bitsadmin.exe]}
    - {field: command_line, op: regex, value: '(-urlcache|/transfer|-split)\b.*https?://'}
- id: R008
  name: Account and domain discovery commands
  description: Commands commonly used to enumerate privileged groups and domain controllers.
  severity: low
  technique: T1087.002
  tactic: Discovery
  confidence: 40
  conditions:
    - {field: event_type, op: eq, value: process_create}
    - {field: command_line, op: regex, value: '(net1?\s+group\s+.*domain\s+admins|net1?\s+user\s+/domain|nltest\s+/dclist|whoami\s+/(priv|groups|all))'}
- id: R009
  name: Brute-force logon attempts
  description: Repeated failed logons for the same account on one endpoint within a short window.
  severity: high
  technique: T1110
  tactic: Credential Access
  confidence: 75
  conditions:
    - {field: event_type, op: eq, value: logon_failure}
  threshold: {count: 5, window_seconds: 60, group_by: [endpoint_id, user]}
- id: R010
  name: Mass file encryption behaviour (ransomware)
  description: One process rewrote or renamed many files to ransomware-style extensions in seconds.
  severity: critical
  technique: T1486
  tactic: Impact
  confidence: 90
  conditions:
    - {field: event_type, op: in, value: [file_modify, file_rename, file_create]}
    - {field: file_ext, op: in, value: ['.locked', '.encrypted', '.crypt', '.enc', '.crypted', '.lockbit', '.ryk']}
  threshold: {count: 20, window_seconds: 10, group_by: [endpoint_id, process_name]}
- id: R011
  name: Windows event log cleared
  description: Event logs were cleared with wevtutil or Clear-EventLog to hide activity.
  severity: high
  technique: T1070.001
  tactic: Defense Evasion
  confidence: 75
  conditions:
    - {field: event_type, op: eq, value: process_create}
    - {field: command_line, op: regex, value: '(wevtutil(\.exe)?\s+(cl|clear-log)\b|clear-eventlog)'}
- id: R012
  name: PowerShell connection to a public IP address
  description: powershell.exe opened an outbound connection to an Internet address.
  severity: medium
  technique: T1071.001
  tactic: Command and Control
  confidence: 55
  conditions:
    - {field: event_type, op: eq, value: network_connect}
    - {field: process_name, op: in, value: [powershell.exe, pwsh.exe]}
    - {field: dest_ip, op: is_public_ip, value: true}
- id: R013
  name: Registry hive export (SAM / SYSTEM / SECURITY)
  description: reg.exe was used to save credential-bearing registry hives.
  severity: high
  technique: T1003.002
  tactic: Credential Access
  confidence: 80
  conditions:
    - {field: event_type, op: eq, value: process_create}
    - {field: process_name, op: eq, value: reg.exe}
    - {field: command_line, op: regex, value: '\bsave\s+hklm\\(sam|system|security)\b'}
- id: R014
  name: User added to a local Administrators group
  description: net.exe was used to add an account to the local Administrators group.
  severity: high
  technique: T1098
  tactic: Persistence
  confidence: 70
  conditions:
    - {field: event_type, op: eq, value: process_create}
    - {field: command_line, op: regex, value: 'net1?\s+localgroup\s+administrators\s+\S+\s+/add'}
